name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xtest0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        working-directory: server
        run: cargo fmt -- --check

      - name: Clippy lint
        working-directory: server
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: server
        run: cargo test --verbose

  client:
    name: Client tests and distributables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Type check
        working-directory: client
        run: npm run typecheck

      - name: Run tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build

      - name: Package npm tarball
        working-directory: client
        run: npm run --silent pack:tarball >/dev/null

      - name: Create standalone and HTML bundle archives
        run: |
          VERSION="$(node -p "require('./client/package.json').version")"
          HTML_DIR="client/dist/artifacts/phantom-screen-html-client-${VERSION}"
          STANDALONE_DIR="client/dist/artifacts/phantom-screen-standalone-client-${VERSION}"
          mkdir -p "$HTML_DIR"
          cp client/dist/html/phantom-screen-client.iife.js "$HTML_DIR/"
          cp client/dist/html/phantom-screen-client.iife.js.map "$HTML_DIR/"
          cp client/examples/embed.html "$HTML_DIR/"
          tar -czf "client/dist/artifacts/phantom-screen-html-client-${VERSION}.tar.gz" -C client/dist/artifacts "phantom-screen-html-client-${VERSION}"
          cp -R client/dist/standalone "$STANDALONE_DIR"
          tar -czf "client/dist/artifacts/phantom-screen-standalone-client-${VERSION}.tar.gz" -C client/dist/artifacts "phantom-screen-standalone-client-${VERSION}"
          rm -rf "$HTML_DIR" "$STANDALONE_DIR"

      - name: Upload client distributables
        uses: actions/upload-artifact@v4
        with:
          name: client-distributables
          path: client/dist/artifacts/*
          if-no-files-found: error

  client-integration:
    name: Client package smoke test
    runs-on: ubuntu-latest
    needs: [client]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/fixtures/next-smoke/package-lock.json

      - name: Run client package smoke test
        run: ./tests/client-package-smoke.sh

  e2e:
    name: E2E (Docker)
    runs-on: ubuntu-latest
    needs: [rust, client]
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: ./tests/e2e.sh

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t phantom-screen -f server/Dockerfile .

  server-distributables:
    name: Server distributable (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [rust, client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xtest0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client standalone assets
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build release server binary
        working-directory: server
        run: cargo build --release

      - name: Package server bundle
        run: |
          VERSION="$(awk -F '"' '/^version = / { print $2; exit }' server/Cargo.toml)"
          mkdir -p dist/server
          bash scripts/package-server-bundle.sh \
            "${{ matrix.platform }}" \
            "$VERSION" \
            "server/target/release/phantom-screen-server" \
            "client/dist/standalone" \
            "dist/server"

      - name: Upload server distributable
        uses: actions/upload-artifact@v4
        with:
          name: server-distributables-${{ matrix.platform }}
          path: dist/server/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish commit release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [rust, client, client-integration, e2e, docker-build, server-distributables]
    permissions:
      contents: write
    steps:
      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-distributables
          path: release-assets

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-distributables-*
          path: release-assets
          merge-multiple: true

      - name: Prepare immutable release tag
        id: release_meta
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `build-${context.sha}`;
            let releaseExists = false;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha,
                });
              } else {
                throw error;
              }
            }

            core.setOutput('tag', tag);
            core.setOutput('release_exists', String(releaseExists));

      - name: Publish GitHub release
        if: steps.release_meta.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          files: release-assets/*
          body: |
            Immutable Phantom Screen distributables for commit `${{ github.sha }}`.

            Assets:
            - Linux server bundles with the standalone client embedded
            - npm-installable client tarball
            - HTML bundle archive
            - standalone client archive

      - name: Skip release on reruns
        if: steps.release_meta.outputs.release_exists == 'true'
        run: echo "Release already exists for build-${GITHUB_SHA}; leaving immutable assets unchanged."
