<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantom Screen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f23;
    }

    #desktop-canvas {
      background: #000;
      cursor: none;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #status-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: rgba(15, 15, 35, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      z-index: 100;
      transition: opacity 0.3s;
      gap: 16px;
    }

    #status-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }

    .status-dot.connected {
      background: #4caf50;
    }

    .status-dot.connecting {
      background: #ff9800;
      animation: pulse 1s infinite;
    }

    .status-dot.error {
      background: #f44336;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #toolbar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 35, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      z-index: 100;
      transition: opacity 0.3s;
    }

    #toolbar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .toolbar-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    .toolbar-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #connect-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f23;
      z-index: 200;
    }

    #connect-screen.hidden {
      display: none;
    }

    #connect-screen h1 {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 300;
      color: #fff;
    }

    #connect-screen p {
      color: #888;
      margin-bottom: 24px;
    }

    #connect-form {
      display: flex;
      gap: 8px;
    }

    #server-url {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      width: 320px;
      outline: none;
    }

    #server-url:focus {
      border-color: rgba(100, 150, 255, 0.5);
    }

    #connect-btn {
      background: #4a6cf7;
      border: none;
      color: white;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    #connect-btn:hover {
      background: #3a5ce7;
    }

    #connect-btn:disabled {
      background: #333;
      cursor: not-allowed;
    }

    #error-msg {
      color: #f44336;
      margin-top: 12px;
      font-size: 13px;
    }

    #stats {
      font-family: monospace;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="connect-screen">
    <h1>Phantom Screen</h1>
    <p>Remote Desktop via Media over QUIC</p>
    <div id="connect-form">
      <input id="server-url" type="text" placeholder="https://localhost:4443" value="https://localhost:4443">
      <button id="connect-btn">Connect</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <div id="container">
    <canvas id="desktop-canvas" tabindex="0"></canvas>
  </div>

  <div id="status-bar">
    <div class="status-item">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
    <div class="status-item" id="stats"></div>
    <div style="flex:1"></div>
    <div class="status-item">
      <span id="resolution-display"></span>
    </div>
  </div>

  <div id="toolbar">
    <button class="toolbar-btn" id="fullscreen-btn" title="Toggle Fullscreen (F11)">Fullscreen</button>
    <button class="toolbar-btn" id="pointer-lock-btn" title="Lock Pointer">Lock Pointer</button>
    <button class="toolbar-btn" id="keyframe-btn" title="Request Keyframe">Refresh</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
