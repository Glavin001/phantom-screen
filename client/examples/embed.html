<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantom Screen HTML bundle example</title>
</head>
<body style="margin:0; background:#020617; color:#e2e8f0; font-family:system-ui,sans-serif;">
  <main style="padding:24px;">
    <h1>Phantom Screen HTML bundle example</h1>
    <p>
      Replace the placeholder certificate hash below with the SHA-256 hash printed by
      <code>scripts/generate-dev-cert-linux.sh</code> (Linux) or <code>docker compose run --rm gen-cert</code> (Docker) or your production certificate tooling.
    </p>
    <div id="remote-desktop" style="width:100%; height:70vh; border-radius:16px; overflow:hidden;"></div>
  </main>

  <script src="./phantom-screen-client.iife.js"></script>
  <script>
    const container = document.getElementById('remote-desktop');
    const client = window.PhantomScreenClient.mountPhantomScreen(container, {
      serverUrl: 'https://127.0.0.1:4443',
      serverCertificateHash: 'REPLACE_WITH_CERT_HASH',
    });

    window.phantomScreenClient = client;
  </script>
</body>
</html>
